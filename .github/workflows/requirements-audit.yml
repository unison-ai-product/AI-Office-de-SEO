name: Requirements Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/audit-requirements.mjs"
      - ".github/workflows/requirements-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/audit-requirements.mjs"
      - ".github/workflows/requirements-audit.yml"

concurrency:
  group: requirements-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit requirements
        run: node scripts/audit-requirements.mjs
