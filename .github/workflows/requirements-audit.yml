name: Requirements Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "docs/design/ai-office-de-seo/**"
      - "scripts/audit-requirements.mjs"
      - ".github/workflows/requirements-audit.yml"

concurrency:
  group: requirements-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit requirements
        run: node scripts/audit-requirements.mjs
